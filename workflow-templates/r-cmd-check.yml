# R CMD check. Pull requests into dev: Ubuntu only (fast, cheap). Release pull requests into main and
# pushes to main: macOS, Windows, and Ubuntu. Job names are fixed because rulesets require them by name.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: R-CMD-check

jobs:
  ubuntu:
    name: R-CMD-check (ubuntu)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::expm
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  other-os:
    # macOS minutes cost 10x and Windows 2x on private repositories: run only for releases.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    name: R-CMD-check (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, os_name: macos}
          - {os: windows-latest, os_name: windows}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::expm
          needs: check
      - uses: r-lib/actions/check-r-package@v2
